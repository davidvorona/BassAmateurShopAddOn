name: Upload Release ZIP

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  upload-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create ZIP of Contents
        run: |
          git archive --format=zip --prefix=BassAmateurShopAddOn/ HEAD -o "BassAmateurShopAddOn-${{ github.event.release.tag_name }}.zip"

      - name: Upload ZIP to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" "BassAmateurShopAddOn-${{ github.event.release.tag_name }}.zip" --clobber
